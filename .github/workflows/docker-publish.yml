name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name student-result-ci \
            -p 8000:8000 \
            $IMAGE_NAME:ci

      - name: Test API health endpoint (HTTP 200)
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done
          echo "Health check failed."
          docker logs student-result-ci
          exit 1

      - name: Test valid prediction request (HTTP 200)
        run: |
          curl --fail --silent --show-error \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}'
          echo ""

      - name: Simulate invalid request for validation warning (HTTP 422)
        run: |
          status=$(curl -s -o /tmp/val_err.json -w "%{http_code}" \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":"not-a-number","internal_marks":85}')
          echo "HTTP Status: $status"
          cat /tmp/val_err.json
          echo ""
          test "$status" = "422"

      - name: Simulate missing route request (HTTP 404)
        run: |
          status=$(curl -s -o /tmp/not_found.json -w "%{http_code}" \
            http://localhost:8000/not-a-real-route)
          echo "HTTP Status: $status"
          cat /tmp/not_found.json
          echo ""
          test "$status" = "404"

      - name: Inspect application runtime logs (200, 422, 404 events)
        if: always()
        run: docker logs student-result-ci

      - name: Remove test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag tested image
        run: |
          docker tag $IMAGE_NAME:ci $IMAGE_ID:latest
          docker tag $IMAGE_NAME:ci $IMAGE_ID:sha-${{ github.sha }}

      - name: Push tested image to GHCR
        run: |
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:sha-${{ github.sha }}
