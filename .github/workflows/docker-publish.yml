name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-result-prediction

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mlops-monitoring Docker network
        run: docker network create mlops-monitoring || true

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:ci .

      - name: Start test container on mlops-monitoring network
        run: |
          docker run -d \
            --name student-result-ci \
            --network mlops-monitoring \
            -p 8000:8000 \
            $IMAGE_NAME:ci

      - name: Test API health endpoint (HTTP 200)
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done
          echo "Health check failed."
          docker logs student-result-ci
          exit 1

      - name: Step 11 - Generate valid predictions, 422 validation errors, and 404 requests
        run: |
          for i in 1 2 3; do
            curl --fail --silent -X POST http://localhost:8000/predict \
              -H "Content-Type: application/json" \
              -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}'
            echo ""
          done
          curl -s -o /dev/null -w "Invalid Request HTTP Status: %{http_code}\n" \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":"invalid","internal_marks":85}'
          curl -s -o /dev/null -w "Missing Route HTTP Status: %{http_code}\n" \
            http://localhost:8000/not-a-real-route

      - name: Step 12 - Inspect /metrics output (student_api_* metrics)
        run: |
          curl --fail --silent http://localhost:8000/metrics | grep -E "student_api_"

      - name: Step 22-24 - Start Prometheus, verify target UP, and execute PromQL queries
        run: |
          cat << 'EOF' > /tmp/prometheus_ci.yml
          global:
            scrape_interval: 5s
            evaluation_interval: 5s
          rule_files:
            - /etc/prometheus/student_api_alerts.yml
          scrape_configs:
            - job_name: "student-result-api"
              scheme: http
              metrics_path: /metrics
              static_configs:
                - targets:
                    - "student-result-ci:8000"
          EOF
          chmod 644 /tmp/prometheus_ci.yml Practical_12_Monitoring/student_api_alerts.yml
          docker run -d \
            --name prometheus \
            --network mlops-monitoring \
            -p 9090:9090 \
            -v "/tmp/prometheus_ci.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "${PWD}/Practical_12_Monitoring/student_api_alerts.yml:/etc/prometheus/student_api_alerts.yml:ro" \
            prom/prometheus
          sleep 12
          echo "=== Prometheus Target State ==="
          curl -s http://localhost:9090/api/v1/targets | python3 -m json.tool | grep -E '"job"|"health"|"scrapeUrl"'
          echo "=== PromQL: student_api_model_loaded ==="
          curl -s -G http://localhost:9090/api/v1/query --data-urlencode 'query=student_api_model_loaded' | python3 -m json.tool
          echo "=== PromQL: sum(student_api_http_requests_total) ==="
          curl -s -G http://localhost:9090/api/v1/query --data-urlencode 'query=sum(student_api_http_requests_total)' | python3 -m json.tool
          echo "=== PromQL: sum(student_api_predictions_total{result="success"}) ==="
          curl -s -G http://localhost:9090/api/v1/query --data-urlencode 'query=sum(student_api_predictions_total{result="success"})' | python3 -m json.tool
          echo "=== Prometheus Alert Rules State ==="
          curl -s http://localhost:9090/api/v1/rules | python3 -m json.tool | grep -E '"name"|"state"|"health"'

      - name: Step 25-26 - Start Grafana and verify connection
        run: |
          docker run -d \
            --name grafana \
            --network mlops-monitoring \
            -p 3000:3000 \
            grafana/grafana
          sleep 8
          curl -s http://localhost:3000/api/health | python3 -m json.tool

      - name: Step 31 - Inspect Practical-11 logs alongside Practical-12 metrics
        if: always()
        run: docker logs student-result-ci

      - name: Step 33 - Clean up test and monitoring containers
        if: always()
        run: docker rm -f grafana prometheus student-result-ci || true

      - name: Create lowercase GHCR image name
        run: |
          IMAGE_ID="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login $REGISTRY \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Tag tested image
        run: |
          docker tag $IMAGE_NAME:ci $IMAGE_ID:latest
          docker tag $IMAGE_NAME:ci $IMAGE_ID:sha-${{ github.sha }}

      - name: Push tested image to GHCR
        run: |
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:sha-${{ github.sha }}
